# main push와 PR마다 테스트 + 빌드.
# Railway는 이 검사가 통과한 커밋만 배포한다 (.railway/railway.ts의 checkSuites).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
